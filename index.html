<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>フォロワー目標ウィジェット</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Fredoka','M PLUS Rounded 1c',sans-serif; background:#f3f8fb; color:#3a4754; overflow-x:hidden; }

/* ── ログイン画面 ── */
#login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.login-card {
  background:white; border-radius:24px; overflow:hidden;
  width:460px; max-width:100%;
  box-shadow:0 8px 40px rgba(100,60,200,0.13);
}
.login-header {
  background:linear-gradient(135deg,#7db8d9,#a8d8ec);
  padding:28px 32px 22px;
  text-align:center;
}
.login-header .logo { font-size:40px; margin-bottom:6px; display:block; }
.login-header h1 { color:white; font-size:22px; font-weight:700; letter-spacing:-0.3px; }
.login-header p { color:rgba(255,255,255,0.8); font-size:13px; margin-top:4px; }

/* ── 設定エリア ── */
.setup-body { padding:24px 28px 20px; }
.steps { margin-bottom:20px; }
.step { display:flex; align-items:center; gap:10px; font-size:13px; color:#3a4754; font-weight:600; margin-bottom:10px; }
.step-n { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:#7db8d9; color:white; font-size:12px; font-weight:700; flex-shrink:0; }
.setup-section-title {
  font-size:13px; font-weight:700; color:#5da3cc;
  letter-spacing:0.5px; text-transform:uppercase;
  margin-bottom:14px; display:flex; align-items:center; gap:6px;
}
.setup-section-title::before { content:''; display:block; width:12px; height:12px; background:#7db8d9; border-radius:3px; }

.field { margin-bottom:14px; }
.field label { display:block; font-size:12px; color:#7a8a99; margin-bottom:5px; font-weight:600; }
.field input[type=text],
.field input[type=number],
.field select {
  width:100%; background:#f8fbfd; border:1.5px solid #cfe3ef;
  border-radius:10px; color:#3a4754; font-size:14px;
  font-family:'Fredoka',sans-serif;
  padding:9px 13px; outline:none; transition:border-color 0.15s;
}
.field input:focus, .field select:focus { border-color:#7db8d9; background:white; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* チェックボックス */
.check-row { display:flex; align-items:center; gap:9px; margin-bottom:10px; cursor:pointer; }
.check-row input[type=checkbox] { width:16px; height:16px; accent-color:#7db8d9; cursor:pointer; }
.check-row span { font-size:13px; color:#3a4754; }

/* ── スライダー ── */
.slider-row { margin-bottom:16px; }
.slider-label { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.slider-label span { font-size:12px; color:#7a8a99; font-weight:600; }
.slider-label .slider-val { font-size:12px; color:#7db8d9; font-weight:700; background:#dceef7; padding:2px 8px; border-radius:20px; }
input[type=range] {
  -webkit-appearance:none; width:100%; height:6px;
  background:#dceef7; border-radius:3px; outline:none; cursor:pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:18px; height:18px;
  border-radius:50%; background:#5da3cc;
  box-shadow:0 2px 6px rgba(212,79,142,0.4); cursor:pointer;
}

/* ── カラーピッカー ── */
.color-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.color-item { display:flex; flex-direction:column; align-items:center; gap:5px; }
.color-item label { font-size:11px; color:#7a8a99; text-align:center; line-height:1.3; }
.color-item input[type=color] {
  width:44px; height:36px; border:1.5px solid #cfe3ef;
  border-radius:8px; cursor:pointer; background:none; padding:2px;
}
.color-item input[type=color]::-webkit-color-swatch-wrapper { padding:0; border-radius:6px; }
.color-item input[type=color]::-webkit-color-swatch { border:none; border-radius:5px; }

/* ── プリセットアイコン ── */
.preset-icons { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
.preset-icon {
  width:40px; height:40px; border-radius:50%; border:2px solid #cfe3ef;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; cursor:pointer; background:#f8fbfd; transition:all 0.15s;
}
.preset-icon:hover { border-color:#7db8d9; background:#dceef7; transform:scale(1.08); }
.preset-icon.selected { border-color:#5da3cc; background:#ffe0ef; box-shadow:0 0 0 3px rgba(212,79,142,0.15); }

/* ── URLフィールド ── */
.url-area { background:#f8fbfd; border:1.5px solid #cfe3ef; border-radius:10px; padding:10px 13px; margin-bottom:10px; }
.url-area p { font-size:11px; color:#7db8d9; margin-bottom:5px; font-weight:600; }
textarea { width:100%; background:transparent; border:none; color:#3a4754; font-size:11px; font-family:monospace; resize:none; height:46px; outline:none; word-break:break-all; }

/* ── ボタン ── */
.twitch-btn {
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; padding:13px; border:none; border-radius:12px;
  background:#9147ff; color:white; font-size:15px; font-weight:700;
  font-family:'Fredoka',sans-serif; cursor:pointer; transition:all 0.18s;
  margin-top:4px; box-shadow:0 4px 16px rgba(145,71,255,0.3);
}
.twitch-btn:hover { background:#7d3cdf; transform:translateY(-1px); box-shadow:0 6px 20px rgba(145,71,255,0.4); }
.copy-btn {
  width:100%; padding:10px; background:#7db8d9; color:white;
  border:none; border-radius:10px; font-size:14px; font-weight:700;
  font-family:'Fredoka',sans-serif; cursor:pointer; margin-bottom:8px;
  transition:background 0.15s;
}
.copy-btn:hover { background:#5da3cc; }
.reset-btn {
  width:100%; padding:9px; background:#f8fbfd; color:#7a8a99;
  border:1.5px solid #cfe3ef; border-radius:10px; font-size:13px; font-weight:600;
  font-family:'Fredoka',sans-serif; cursor:pointer; transition:all 0.15s;
}
.reset-btn:hover { background:#dceef7; color:#5da3cc; border-color:#c4a8f0; }

.obs-hint { background:#efffee; border-left:3px solid #6dbf6d; border-radius:8px; padding:8px 12px; font-size:12px; color:#5a7a5a; line-height:1.6; }
.obs-hint b { color:#4a8a4a; }

.divider { border:none; border-top:1.5px solid #f0e8f8; margin:18px 0; }

/* レイアウト 2カラム（設定画面） */
.setup-cols { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }

/* ── ウィジェット ── */
#widget { display:none; }
.confetti-pc { position:absolute; display:block; border-radius:2px; animation:cf linear forwards; }
@keyframes cf { 0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:1} 80%{opacity:1} 100%{transform:translateY(120%) translateX(var(--drift)) rotate(var(--rot));opacity:0} }
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="login-header">
      <span class="logo">🎮</span>
      <h1>フォロワー目標ウィジェット</h1>
      <p>OBSブラウザソース用 — 設定してTwitchでログイン！</p>
    </div>

    <div class="setup-body">
      <div class="steps">
        <div class="step"><span class="step-n">1</span> 設定を入力する</div>
        <div class="step"><span class="step-n">2</span> 「Twitchでログイン」を押す</div>
        <div class="step"><span class="step-n">3</span> 生成されたURLをOBSに貼る</div>
      </div>

      <div class="row2">
        <div class="field">
          <label>目標フォロワー数</label>
          <input type="number" id="iGoal" value="500" min="1">
        </div>
        <div class="field">
          <label>自動増加人数（0=無効）</label>
          <input type="number" id="iStep" value="0" min="0">
        </div>
      </div>

      <div class="field">
        <label>デザインテーマ</label>
        <select id="iTheme">
          <option value="battery">A · 電池（チャージ）</option>
          <option value="rocket">D · ロケット</option>
          <option value="thermo">K1 · 温度計（クラシック）</option>
          <option value="thermo-gauge">K2 · 温度計（丸ゲージ）</option>
          <option value="boba">L1 · タピオカ（トール）</option>
          <option value="boba-round">L2 · タピオカ（まんまる）</option>
          <option value="battery-h">A横 · 電池（横型）</option>
          <option value="rocket-h">D横 · ロケット（横型）</option>
          <option value="segbar">H1 · セグメントバー（横型）</option>
          <option value="equalizer">H7 · イコライザー（横型）</option>
          <option value="mendako">🩷 メンダコ（横型）</option>
        </select>
      </div>

      <button class="twitch-btn" id="loginBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
        Twitchでログイン
      </button>

      <div id="urlSection" style="display:none;margin-top:16px;">
        <div class="url-area">
          <p>✅ このURLをOBSのブラウザソースに貼り付けてください</p>
          <textarea id="urlText" readonly></textarea>
        </div>
        <button class="copy-btn" id="copyBtn">URLをコピー</button>
        <div class="obs-hint">
          <b>OBS設定：</b> 幅 <b>372</b> / 高さ <b>462</b>（横型は高さ <b>210</b>）
        </div>
      </div>
    </div>
  </div>
</div>

<div id="widget">
  <div id="w-root"></div>
</div>

<script>
// ── 設定 ──
// ※ このClient IDはtwitchtokengenerator.comのものを使用
// ※ GitHub Pagesで公開するためPublicでも問題なし
var CLIENT_ID = 'q3qw3df80v2h7ufej054yhicp7yrxu';
var REDIRECT_URI = 'https://enegori0.github.io/obs-follower-widget/';

// ── URLパラメーター読み込み ──
var params = new URLSearchParams(location.search);
var tok      = params.get('tok') || '';
var username = params.get('u')   || '';
var goal     = parseInt(params.get('g')) || 500;
var theme    = params.get('t')   || 'battery';
var step     = parseInt(params.get('s')) || 0;

// ── モード判定 ──
var isWidget = !!(tok && username);

if (isWidget) {
  document.getElementById('login').style.display = 'none';
  document.getElementById('widget').style.display = 'block';
  document.documentElement.style.background = 'transparent';
  document.body.style.background = 'transparent';
} else {
  document.getElementById('login').style.display = 'flex';
  document.getElementById('widget').style.display = 'none';

  // Twitchコールバック処理（#access_token=...）
  if (location.hash && location.hash.includes('access_token')) {
    var hp = new URLSearchParams(location.hash.replace('#',''));
    var accessToken = hp.get('access_token');
    var stateKey = hp.get('state');
    var st = {};
    // localStorageから設定値を取得
    try {
      var saved = localStorage.getItem('tw_state_'+stateKey);
      if (saved) { st = JSON.parse(saved); localStorage.removeItem('tw_state_'+stateKey); }
    } catch(e){}
    history.replaceState(null,'',location.pathname);

    if (accessToken) {
      fetch('https://api.twitch.tv/helix/users', {
        headers:{'Client-ID':CLIENT_ID,'Authorization':'Bearer '+accessToken}
      })
      .then(function(r){return r.json();})
      .then(function(d){
        var uname = d.data && d.data[0] ? d.data[0].login : '';
        var base = location.origin + location.pathname.replace(/\/?$/,'/');
        var url = base
          + '?tok=' + encodeURIComponent(accessToken)
          + '&u='   + encodeURIComponent(uname)
          + '&g='   + (st.g||500)
          + '&t='   + (st.t||'battery')
          + '&s='   + (st.s||0);
        document.getElementById('urlText').value = url;
        document.getElementById('urlSection').style.display = 'block';
        if(st.t) document.getElementById('iTheme').value = st.t;
        if(st.g) document.getElementById('iGoal').value = st.g;
        if(st.s) document.getElementById('iStep').value = st.s;
      })
      .catch(function(){alert('ユーザー情報取得に失敗しました。もう一度お試しください。');});
    }
  }

  // ログインボタン

  document.getElementById('loginBtn').addEventListener('click', function(){
    var g = parseInt(document.getElementById('iGoal').value)||500;
    var s = parseInt(document.getElementById('iStep').value)||0;
    var t = document.getElementById('iTheme').value;
    // stateはシンプルなランダム文字列にする（Twitch推奨）
    var stateKey = Math.random().toString(36).substring(2,15);
    // 設定値はlocalStorageに保存
    try { localStorage.setItem('tw_state_'+stateKey, JSON.stringify({g:g,s:s,t:t})); } catch(e){}
    var url = 'https://id.twitch.tv/oauth2/authorize'
      + '?client_id=' + CLIENT_ID
      + '&redirect_uri=' + encodeURIComponent(REDIRECT_URI)
      + '&response_type=token'
      + '&scope=moderator%3Aread%3Afollowers'
      + '&state=' + stateKey;
    location.href = url;
  });

  // コピーボタン
  document.getElementById('copyBtn').addEventListener('click', function(){
    document.getElementById('urlText').select();
    document.execCommand('copy');
    this.textContent = 'コピーしました！';
    var self = this;
    setTimeout(function(){self.textContent = 'URLをコピー';}, 2000);
  });
}
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
// ウィジェットモードのみReactを起動
if (typeof tok !== 'undefined' && tok && typeof username !== 'undefined' && username) {

var TH = {
  ink:'#15121c',inkDeep:'#0e0b14',vessel:'#221c30',
  line:'rgba(255,255,255,0.08)',textHi:'#f4f0ff',textLo:'#a99fc4',
  font:'"Fredoka",sans-serif',
};
var c01=function(x){return Math.max(0,Math.min(1,x));};
var fm=function(n){return Math.round(n).toLocaleString();};
var ce=React.createElement;
var _=React;

function Confetti(p){
  var pieces=_.useMemo(function(){
    var cols=p.colors||['#9147ff','#ffd23f','#46d6c0','#ff7eb6','#aef34d'];
    return Array.from({length:20},function(_,i){return{left:Math.random()*100,delay:Math.random()*0.4,dur:1.5+Math.random()*1.2,size:4+Math.random()*5,rot:Math.random()*360,color:cols[i%cols.length],round:Math.random()>0.5,drift:(Math.random()-0.5)*60};});
  },[]);
  if(!p.show)return null;
  return ce('div',{style:{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none',zIndex:6}},
    pieces.map(function(pc,i){return ce('span',{key:i,className:'confetti-pc',style:{left:pc.left+'%',top:'-12%',width:pc.size,height:pc.size*(pc.round?1:1.5),background:pc.color,borderRadius:pc.round?'50%':'1px',animationDuration:pc.dur+'s',animationDelay:pc.delay+'s','--drift':pc.drift+'px','--rot':pc.rot+'deg'}});})
  );
}

function Sp(p){
  if(!p.show)return null;
  return ce('g',null,(p.points||[]).map(function(pt,i){
    return ce('g',{key:i,transform:'translate('+pt.x+' '+pt.y+')',opacity:0},
      ce('animate',{attributeName:'opacity',values:'0;1;0',dur:'1.4s',begin:(i*0.18)+'s',repeatCount:'indefinite'}),
      ce('path',{d:'M0 '+-pt.s+' L'+(pt.s*.28)+' '+(-pt.s*.28)+' L'+pt.s+' 0 L'+(pt.s*.28)+' '+(pt.s*.28)+' L0 '+pt.s+' L'+(-pt.s*.28)+' '+(pt.s*.28)+' L'+-pt.s+' 0 L'+(-pt.s*.28)+' '+(-pt.s*.28)+' Z',fill:p.color||'#fff'})
    );
  }));
}

function Wv(p){
  var x=p.region.x,y=p.region.y,w=p.region.w,h=p.region.h,pct=c01(p.pct),lv=h*(1-pct),a=p.amp||6,d=p.dur||4.5;
  var sg='q '+(w/4)+' '+-a+' '+(w/2)+' 0 q '+(w/4)+' '+a+' '+(w/2)+' 0';
  var dv='M 0 0 '+sg+' '+sg+' L '+(2*w)+' '+h+' L 0 '+h+' Z';
  var sg2='q '+(w/4)+' '+(a*.7)+' '+(w/2)+' 0 q '+(w/4)+' '+(-a*.7)+' '+(w/2)+' 0';
  var dv2='M 0 0 '+sg2+' '+sg2+' L '+(2*w)+' '+h+' L 0 '+h+' Z';
  var at=function(f,t,s){return ce('animateTransform',{attributeName:'transform',type:'translate',from:f,to:t,dur:(s||d)+'s',repeatCount:'indefinite'});};
  return ce('g',{transform:'translate('+x+' '+y+')'},
    ce('g',{style:{transform:'translateY('+lv+'px)',transition:'transform .75s cubic-bezier(.22,.61,.36,1)'}},
      ce('path',{d:dv2,fill:p.color2||p.color,opacity:.55},at('0 0',(-w)+' 0',d*1.45)),
      ce('path',{d:dv,fill:p.color,opacity:1},at((-w)+' 0','0 0')),
      ce('path',{d:dv,fill:'#fff',opacity:.15,transform:'translate(0 -2)'},at((-w)+' -2','0 -2'))
    )
  );
}

function HWv(p){
  var x=p.region.x,y=p.region.y,w=p.region.w,h=p.region.h,pct=c01(p.pct),lv=w*pct,L=h,a=p.amp||5,d=p.dur||4.5;
  function bld(aa){var dv='M 0 '+-h;for(var yy=-h;yy<2*h;yy+=L)dv+=' q '+aa+' '+(L/4)+' 0 '+(L/2)+' q '+-aa+' '+(L/4)+' 0 '+(L/2);return dv+' L '+(-(w+a+2))+' '+(2*h)+' L '+(-(w+a+2))+' '+-h+' Z';}
  var dv=bld(a),dv2=bld(-a*.7);
  var at=function(f,t,s){return ce('animateTransform',{attributeName:'transform',type:'translate',from:f,to:t,dur:(s||d)+'s',repeatCount:'indefinite'});};
  return ce('g',{transform:'translate('+x+' '+y+')'},
    ce('g',{style:{transform:'translateX('+lv+'px)',transition:'transform .75s cubic-bezier(.22,.61,.36,1)'}},
      ce('path',{d:dv2,fill:p.color2||p.color,opacity:.55},at('0 0','0 '+-L,d*1.45)),
      ce('path',{d:dv,fill:p.color,opacity:1},at('0 '+-L,'0 0')),
      ce('path',{d:dv,fill:'#fff',opacity:.15,transform:'translate(-2 0)'},at('-2 '+-L,'-2 0'))
    )
  );
}

function Bb(p){
  var x=p.region.x,y=p.region.y,w=p.region.w,h=p.region.h,pct=c01(p.pct);
  if(pct<.08)return null;
  var top=y+h*(1-pct)+6;
  return ce('g',null,[{dx:.3,r:3,d:3.1,dl:0},{dx:.55,r:2.2,d:2.4,dl:.8},{dx:.72,r:3.4,d:3.6,dl:1.6}].map(function(b,i){
    return ce('circle',{key:i,cx:x+w*b.dx,r:b.r,fill:p.color||'#fff',opacity:0},
      ce('animate',{attributeName:'cy',from:y+h-4,to:top,dur:b.d+'s',begin:b.dl+'s',repeatCount:'indefinite'}),
      ce('animate',{attributeName:'opacity',values:'0;0.5;0.5;0',dur:b.d+'s',begin:b.dl+'s',repeatCount:'indefinite'})
    );
  }));
}

function Shell(p){
  var W=p.W||372,H=p.H||462,illoH=p.illoH||286,rem=Math.max(0,p.goal-p.count);
  return ce('div',{style:{position:'relative',width:W,height:H,boxSizing:'border-box',display:'flex',flexDirection:'column',padding:'20px 22px 22px',fontFamily:TH.font,color:TH.textHi,background:'transparent',boxShadow:'none',overflow:'hidden'}},
    ce(Confetti,{show:p.reached,colors:[p.accent,p.accentSoft||p.accent,'#fff','#9147ff']}),
    ce('div',{style:{display:'flex',alignItems:'center',gap:9,zIndex:2}},
      ce('span',{style:{width:9,height:9,borderRadius:'50%',background:p.accent,boxShadow:'0 0 8px '+p.accent}}),
      ce('span',{style:{fontSize:15,fontWeight:600,color:TH.textHi,textShadow:'0 1px 6px rgba(0,0,0,.6)'}},p.title),
      ce('span',{style:{marginLeft:'auto',fontSize:11,fontWeight:600,letterSpacing:1.4,textTransform:'uppercase',color:TH.textLo,textShadow:'0 1px 6px rgba(0,0,0,.6)'}},p.kicker)
    ),
    ce('div',{style:{flex:1,minHeight:illoH,display:'flex',alignItems:'center',justifyContent:'center',zIndex:2,filter:'drop-shadow(0 4px 16px rgba(0,0,0,.45))'}},p.children),
    ce('div',{style:{display:'flex',alignItems:'flex-end',justifyContent:'space-between',zIndex:2}},

        {bx:-12,by:42,angle:0.05,len:44,phase:1.4},
        {bx:4,by:42,angle:0.2,len:44,phase:2.0},
        {bx:18,by:40,angle:0.35,len:42,phase:2.6},
        {bx:30,by:35,angle:0.55,len:38,phase:3.2},
        {bx:-50,by:16,angle:-0.75,len:34,phase:3.8},
        {bx:42,by:16,angle:0.75,len:34,phase:4.4},
      ];
      tentacles.forEach(function(tn,i){
        var wave=Math.sin(t2+tn.phase)*10;
        var ex=tn.bx+Math.cos(tn.angle+wave*0.04)*tn.len;
        var ey=tn.by+tn.len*0.9;
        var cx2=tn.bx+Math.cos(tn.angle)*tn.len*0.4+wave*0.6;
        var cy2=tn.by+tn.len*0.55+Math.abs(wave)*0.2;
        ctx.beginPath();ctx.moveTo(tn.bx,tn.by);
        ctx.quadraticCurveTo(cx2,cy2,ex+wave*0.5,ey);
        ctx.strokeStyle='rgba(255,175,205,0.9)';
        ctx.lineWidth=i<6?8:7;ctx.lineCap='round';ctx.stroke();
        ctx.strokeStyle='rgba(255,230,242,0.6)';ctx.lineWidth=3;ctx.stroke();
      });
      // 本体
      var BW=150,BH=120,bx=-BW/2,by=-BH/2-4;
      ctx.beginPath();
      ctx.moveTo(bx+BW*0.45,by);
      ctx.bezierCurveTo(bx+BW*0.75,by,bx+BW,by+BH*0.08,bx+BW,by+BH*0.5);
      ctx.bezierCurveTo(bx+BW,by+BH*0.9,bx+BW*0.7,by+BH,bx+BW*0.5,by+BH);
      ctx.bezierCurveTo(bx+BW*0.3,by+BH,bx,by+BH*0.9,bx,by+BH*0.5);
      ctx.bezierCurveTo(bx,by+BH*0.08,bx+BW*0.25,by,bx+BW*0.45,by);
      ctx.closePath();
      var bodyGrd=ctx.createRadialGradient(-10,-30,5,0,-10,75);
      bodyGrd.addColorStop(0,'#fff7fb');bodyGrd.addColorStop(0.4,'#ffe5f0');bodyGrd.addColorStop(1,'#ffc0d9');
      ctx.fillStyle=bodyGrd;ctx.fill();
      ctx.strokeStyle='rgba(255,200,225,0.5)';ctx.lineWidth=2;ctx.stroke();
      // 内側グロー
      var ig=ctx.createRadialGradient(0,-20,5,0,20,70);
      ig.addColorStop(0,'rgba(255,255,255,0.4)');ig.addColorStop(1,'rgba(255,150,190,0.2)');
      ctx.fillStyle=ig;ctx.fill();
      // 目
      ctx.beginPath();ctx.roundRect(-38,-4,18,6,3);ctx.fillStyle='#7b4d67';ctx.fill();
      ctx.beginPath();ctx.roundRect(20,-4,18,6,3);ctx.fill();
      // 頬
      ctx.beginPath();ctx.ellipse(-28,14,14,10,0,0,Math.PI*2);ctx.fillStyle='rgba(255,170,200,0.45)';ctx.fill();
      ctx.beginPath();ctx.ellipse(28,14,14,10,0,0,Math.PI*2);ctx.fill();
      // ハイライト
      ctx.beginPath();ctx.ellipse(-12,-28,22,12,-0.3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.38)';ctx.fill();
      ctx.restore();
    }

    function renderFrame(){
      ftRef.current++;
      var ft2=ftRef.current;
      ctx.clearRect(0,0,W,H);

      // 水槽背景
      tankPath();
      ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fill();

      // 液体クリップ
      ctx.save();
      tankPath();ctx.clip();
      var fillW=TW*pct;
      var lg=ctx.createLinearGradient(TX,TY,TX,TY+TH);
      lg.addColorStop(0,'#ffd7ea');lg.addColorStop(0.4,'#ffb7d4');lg.addColorStop(1,'#ff94c1');
      ctx.fillStyle=lg;ctx.fillRect(TX,TY,fillW,TH);
      // 波
      var wt=ft2*0.03;
      ctx.beginPath();ctx.moveTo(TX,TY+18);
      for(var i=0;i<=fillW+80;i+=4){
        var wy=TY+18+Math.sin(wt+i*0.04)*5+Math.sin(wt*0.7+i*0.025)*3;
        ctx.lineTo(TX+i,wy);
      }
      ctx.lineTo(TX+fillW,TY);ctx.lineTo(TX,TY);ctx.closePath();
      ctx.fillStyle='rgba(255,255,255,0.28)';ctx.fill();
      // 泡
      [{px:0.15,phase:0,r:9,sp:0.007},{px:0.38,phase:40,r:12,sp:0.006},{px:0.58,phase:20,r:7.5,sp:0.008},{px:0.78,phase:60,r:14,sp:0.005}].forEach(function(b){
        if(b.px>pct)return;
        var bx2=TX+TW*b.px;
        var rawY=((ft2*b.sp*TH+b.phase)%(TH+30));
        var by2=TY+TH-rawY+10;
        var bg2=ctx.createRadialGradient(bx2-b.r*0.3,by2-b.r*0.3,b.r*0.1,bx2,by2,b.r);
        bg2.addColorStop(0,'rgba(255,255,255,0.85)');bg2.addColorStop(0.4,'rgba(255,200,230,0.5)');bg2.addColorStop(1,'rgba(255,180,215,0.15)');
        ctx.beginPath();ctx.arc(bx2,by2,b.r,0,Math.PI*2);ctx.fillStyle=bg2;ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1.5;ctx.stroke();
        ctx.beginPath();ctx.arc(bx2-b.r*0.32,by2-b.r*0.32,b.r*0.38,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.8)';ctx.fill();
      });
      ctx.restore();

      // 水槽枠
      tankPath();
      ctx.strokeStyle='rgba(255,182,212,0.85)';ctx.lineWidth=4;ctx.stroke();
      // 内側グロー
      tankPath();ctx.save();ctx.clip();
      var innerGlow=ctx.createRadialGradient(TX+TW*0.5,TY,0,TX+TW*0.5,TY+TH*0.5,TH);
      innerGlow.addColorStop(0,'rgba(255,255,255,0.35)');innerGlow.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=innerGlow;ctx.fillRect(TX,TY,TW,TH);ctx.restore();

      // メンダコ（中央固定）
      var floatY=Math.sin(ft2*0.04)*8;
      drawMendako(TX+TW*0.5, TY+TH*0.5+2+floatY, ft2);

      // 情報パネル
      var IX=TW+30;
      var pctNum=Math.round(pct*100);
      ctx.font='800 20px Nunito,sans-serif';ctx.fillStyle='#ff7fb3';ctx.textAlign='left';
      ctx.fillText('FOLLOWER GOAL',IX,TY+32);
      ctx.font='900 74px Nunito,sans-serif';ctx.fillStyle='#ff7fb3';
      ctx.fillText(pctNum+'%',IX,TY+110);
      ctx.font='700 28px Nunito,sans-serif';ctx.fillStyle='#c0709a';
      ctx.fillText(count.toLocaleString()+' / '+goal.toLocaleString(),IX,TY+145);

      rafRef.current=requestAnimationFrame(renderFrame);
    }

    renderFrame();
    return function(){ if(rafRef.current) cancelAnimationFrame(rafRef.current); };
  },[pct,count,goal]);

  return ce('canvas',{ref:canvasRef,width:W,height:H,style:{display:'block'}});
}

function klLerp(a, b, t) {
  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  const c = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
  return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
}

// ── K2 · 丸ゲージ（アナログ針メーター） ────────────────────────────────────
function ThermoGaugeWidget({ count, goal, reached }) {
  const pct = c01(count / goal);
  const accent = '#ff6b6b', cold = '#5fb0ff';
  const cx = 110, cy = 152, R = 82;
  const A0 = -128, A1 = 128, sweep = A1 - A0;
  const pol = (ang, r) => { const t = ang * Math.PI / 180; return [cx + r * Math.sin(t), cy - r * Math.cos(t)]; };
  const arc = (from, to, r) => {
    const [x0, y0] = pol(from, r), [x1, y1] = pol(to, r);
    const large = Math.abs(to - from) > 180 ? 1 : 0;
    return `M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1}`;
  };
  const nAng = A0 + sweep * pct;
  const [nx, ny] = pol(nAng, R - 16);
  return (
    <Shell accent={accent} accentSoft={cold} title="フォロワー目標" kicker="Gauge" count={count} goal={goal} reached={reached}>
      <svg viewBox="0 0 220 250" width="210" style={{ overflow: 'visible' }}>
        <defs>
          <linearGradient id="gauge-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stopColor={cold} /><stop offset="0.5" stopColor="#ffd23f" /><stop offset="1" stopColor={accent} /></linearGradient>
        </defs>
        {/* track */}
        <path d={arc(A0, A1, R)} fill="none" stroke={TH.vessel} strokeWidth="16" strokeLinecap="round" />
        {/* value arc */}
        <path d={arc(A0, A1, R)} fill="none" stroke="url(#gauge-g)" strokeWidth="16" strokeLinecap="round"
          pathLength="1" strokeDasharray="1" strokeDashoffset={1 - pct}
          style={{ transition: 'stroke-dashoffset .8s cubic-bezier(.22,.61,.36,1)', filter: reached ? `drop-shadow(0 0 8px ${accent})` : 'none' }} />
        {/* ticks */}
        {[0, 0.25, 0.5, 0.75, 1].map((t, i) => {
          const ang = A0 + sweep * t;
          const [x1, y1] = pol(ang, R - 24), [x2, y2] = pol(ang, R - 12);
          const [lx, ly] = pol(ang, R - 38);
          return (
            <g key={i}>
              <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="rgba(255,255,255,0.4)" strokeWidth="2.5" />
              <text x={lx} y={ly + 4} textAnchor="middle" fontFamily={TH.font} fontSize="11" fontWeight="600" fill={TH.textLo}>{fm(goal * t)}</text>
            </g>
          );
        })}
        {/* needle */}
        <g style={{ transition: 'transform .8s cubic-bezier(.34,1.4,.5,1)' }} transform={`rotate(${nAng} ${cx} ${cy})`}>
          <path d={`M${cx} ${cy} L${cx - 5} ${cy} L${cx} ${cy - R + 16} L${cx + 5} ${cy} Z`} fill={accent} />
        </g>
        <circle cx={cx} cy={cy} r="11" fill="#2a2438" stroke={accent} strokeWidth="3" />
        <circle cx={cx} cy={cy} r="3" fill={accent} />
        {/* readout */}
        <text x={cx} y={cy + 44} textAnchor="middle" fontFamily={TH.font} fontSize="26" fontWeight="600" fill={TH.textHi} style={{ fontVariantNumeric: 'tabular-nums' }}>{fm(count)}</text>
        <text x={cx} y={cy + 60} textAnchor="middle" fontFamily={TH.font} fontSize="12" fontWeight="500" fill={TH.textLo}>フォロワー</text>
        <Sp show={reached} color={accent} points={[{ x: 36, y: 96, s: 7 }, { x: 184, y: 96, s: 6 }, { x: 110, y: 44, s: 8 }]} />
      </svg>
    </Shell>
  );
}

  const pct = c01(count / goal);
  const cold = '#5fb0ff', hot = '#ff5d6e';
  const N = 10, lit = Math.round(N * pct);
  const segW = 44, segH = 13, gap = 5, x = 110 - segW / 2;
  const baseY = 196;
  return (
    <Shell accent={hot} accentSoft={cold} title="フォロワー目標" kicker="Sensor" count={count} goal={goal} reached={reached}>
      <svg viewBox="0 0 220 256" width="206" style={{ overflow: 'visible' }}>
        {/* bulb reservoir */}
        <circle cx="110" cy="222" r="22" fill={lit > 0 ? hot : TH.vessel} stroke={lit > 0 ? hot : 'rgba(255,255,255,0.12)'} strokeWidth="2.5" style={{ transition: 'fill .4s' }} />
        <rect x={x + 6} y="206" width={segW - 12} height="18" fill={lit > 0 ? hot : TH.vessel} style={{ transition: 'fill .4s' }} />
        {Array.from({ length: N }, (_, i) => {
          const on = i < lit;
          const col = klLerp(cold, hot, i / (N - 1));
          const y = baseY - i * (segH + gap);
          return (
            <g key={i} style={{ transition: 'opacity .4s' }}>
              <rect x={x} y={y} width={segW} height={segH} rx={segH / 2}

            </g>
          );
        })}
        {/* side ticks */}
        {[0, 0.5, 1].map((t, i) => {
          const y = baseY + segH / 2 - (N - 1) * (segH + gap) * t;
          return (
            <g key={i}>
              <line x1={x + segW + 8} x2={x + segW + 18} y1={y} y2={y} stroke="rgba(255,255,255,0.3)" strokeWidth="2" />

      </svg>
    </Shell>
  );
}

        <path d="M88 78 A30 30 0 0 1 112 60" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" opacity="0.4" />

      </svg>

  );
}


/* ===== H1 セグメントバー / H7 イコライザー（横型）===== */
function SegBarHWidget({ count, goal, reached }) {
  const pct = c01(count / goal);
  const accent = '#9147ff', accent2 = '#b794ff';
  const N = 16, lit = Math.round(N * pct);
  const x0 = 24, y = 40, w = 242, gap = 4, segW = (w - gap * (N - 1)) / N, segH = 44;
  return (
    <Shell accent={accent} accentSoft={accent2} title="フォロワー目標" kicker="Loading" count={count} goal={goal} reached={reached} W={372} H={210} illoH={110}>
      <svg viewBox="0 0 290 110" width="334" style={{ overflow: 'visible' }}>
        <defs>
          <linearGradient id="seg-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stopColor={accent2} /><stop offset="1" stopColor={accent} /></linearGradient>
        </defs>
        {/* track */}
        <rect x={x0 - 6} y={y - 6} width={w + 12} height={segH + 12} rx="12" fill={TH.vessel} stroke="rgba(255,255,255,0.12)" strokeWidth="2" />
        {Array.from({ length: N }, (_, i) => {
          const on = i < lit;
          return (
            <g key={i} style={{ transition: 'opacity .3s' }}>
              <rect x={x0 + i * (segW + gap)} y={y} width={segW} height={segH} rx="3"
                fill={on ? 'url(#seg-g)' : 'rgba(255,255,255,0.05)'}
                style={{ filter: on ? `drop-shadow(0 0 5px ${accent}aa)` : 'none', transition: 'fill .3s, filter .3s' }}>
                {on && i === lit - 1 && <animate attributeName="opacity" values="1;0.55;1" dur="1s" repeatCount="indefinite" />}
              </rect>
            </g>
          );
        })}
        {reached && <rect x={x0 - 6} y={y - 6} width={w + 12} height={segH + 12} rx="12" fill="none" stroke={accent} strokeWidth="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.3s" repeatCount="indefinite" /></rect>}
        <text x="145" y="102" textAnchor="middle" fontFamily={TH.font} fontWeight="600" fontSize="14" fill={TH.textLo}>{Math.round(pct * 100)}%</text>
        <Sp show={reached} color={accent} points={[{ x: 30, y: 22, s: 7 }, { x: 260, y: 24, s: 6 }, { x: 145, y: 14, s: 7 }]} />
      </svg>
    </Shell>
  );
}


function EqualizerHWidget({ count, goal, reached }) {
  const pct = c01(count / goal);
  const accent = '#b794ff', accent2 = '#ff7eb6';
  const N = 22, lit = Math.round(N * pct);
  const x0 = 26, baseY = 86, w = 238, gap = 3, barW = (w - gap * (N - 1)) / N;
  const heights = Array.from({ length: N }, (_, i) => 14 + Math.abs(Math.sin(i * 0.9) * 0.6 + Math.sin(i * 0.37) * 0.4) * 44);
  return (
    <Shell accent={accent} accentSoft={accent2} title="フォロワー目標" kicker="Now Playing" count={count} goal={goal} reached={reached} W={372} H={210} illoH={110}>
      <svg viewBox="0 0 290 112" width="334" style={{ overflow: 'visible' }}>
        <defs>
          <linearGradient id="eq-g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stopColor={accent2} /><stop offset="1" stopColor={accent} /></linearGradient>
        </defs>
        <line x1={x0 - 4} y1={baseY + 3} x2={x0 + w + 4} y2={baseY + 3} stroke="rgba(255,255,255,0.1)" strokeWidth="2" strokeLinecap="round" />
        {heights.map((h, i) => {
          const on = i < lit;
          const x = x0 + i * (barW + gap);
          return (
            <rect key={i} x={x} y={baseY - h} width={barW} height={h} rx={barW / 2}
              fill={on ? 'url(#eq-g)' : 'rgba(255,255,255,0.07)'}
              style={{ filter: on ? `drop-shadow(0 0 4px ${accent}88)` : 'none', transition: 'fill .3s' }}>
              {on && <animate attributeName="height" values={`${h};${h * 0.5};${h};${h * 0.8};${h}`} dur={`${0.8 + (i % 5) * 0.18}s`} repeatCount="indefinite" />}
              {on && <animate attributeName="y" values={`${baseY - h};${baseY - h * 0.5};${baseY - h};${baseY - h * 0.8};${baseY - h}`} dur={`${0.8 + (i % 5) * 0.18}s`} repeatCount="indefinite" />}
            </rect>
          );
        })}
        <text x="145" y="106" textAnchor="middle" fontFamily={TH.font} fontWeight="600" fontSize="13" fill={TH.textLo}>{Math.round(pct * 100)}% 再生中</text>
        <Sp show={reached} color={accent} points={[{ x: 34, y: 20, s: 7 }, { x: 256, y: 22, s: 6 }, { x: 145, y: 12, s: 7 }]} />
      </svg>
    </Shell>
  );
}




var WS={battery:BatteryW,rocket:RocketW,thermo:ThermometerWidget,'thermo-gauge':ThermoGaugeWidget,boba:BobaWidget,'boba-round':BobaRoundWidget,'battery-h':BatteryHW,'rocket-h':RocketHW,segbar:SegBarHWidget,equalizer:EqualizerHWidget,mendako:MendakoW};

function App(){
  var countState=_.useState(0); var count=countState[0],setCount=countState[1];
  var goalState=_.useState(goal); var curGoal=goalState[0],setCurGoal=goalState[1];
  var okState=_.useState(true); var ok=okState[0],setOk=okState[1];
  var reached=count>=curGoal;
  var W=WS[theme]||BatteryW;
  _.useEffect(function(){
    async function fd(){
      try{
        var ur=await fetch('https://api.twitch.tv/helix/users?login='+username,{headers:{'Client-ID':CLIENT_ID,'Authorization':'Bearer '+tok}});
        if(!ur.ok)throw new Error('u');
        var ud=await ur.json();
        var uid=ud.data[0].id;
        var fr=await fetch('https://api.twitch.tv/helix/channels/followers?broadcaster_id='+uid+'&moderator_id='+uid,{headers:{'Client-ID':CLIENT_ID,'Authorization':'Bearer '+tok}});
        if(!fr.ok)throw new Error('f');
        var fd2=await fr.json();
        var c=fd2.total||0;
        setOk(true);setCount(c);
        if(step>0&&c>=curGoal){setCurGoal(function(g){var n=c+step-(c%step||step);return n<=c?c+step:n;});}
      }catch(e){setOk(false);}
    }
    fd();
    var id=setInterval(fd,30000);
    return function(){clearInterval(id);};
  },[curGoal]);
  return ce('div',{style:{position:'relative',display:'inline-block'}},
    ce('div',{style:{position:'absolute',top:8,right:10,width:7,height:7,borderRadius:'50%',background:ok?'#4caf50':'#f44336',zIndex:10}}),
    ce(W,{count:count,goal:curGoal,reached:reached})
  );
}

ReactDOM.createRoot(document.getElementById('w-root')).render(ce(App));

} // end if widget mode
